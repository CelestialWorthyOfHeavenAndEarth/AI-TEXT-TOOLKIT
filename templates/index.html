<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Text Toolbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body {
      background: url("/static/background.jpeg") no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background 0.3s;
    }

    .fade-in { animation: fadeInUp 1s ease-out both; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .btn {
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 0 0 transparent;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 16px #8b5cf6cc;
    }

    .btn:disabled {
      opacity: 0.5;
      transform: none;
      cursor: not-allowed;
    }

    .glow-text {
      color: #ffffff;
      text-shadow: 0 0 5px #a78bfa, 0 0 15px #8b5cf6;
    }

    .typing {
      border-right: 2px solid #fff;
      white-space: pre-wrap;
      overflow: hidden;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .loader {
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    /* Improved output styling */
    .output-card {
      max-height: 300px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .output-card::-webkit-scrollbar {
      width: 6px;
    }

    .output-card::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.3);
      border-radius: 3px;
    }
    
    /* Dark mode toggle styling */
    .theme-toggle {
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 100px;
      padding: 2px 8px;
      display: flex;
      align-items: center;
    }

    .theme-toggle input {
      display: none;
    }

    .toggle-circle {
      height: 20px;
      width: 20px;
      background: white;
      border-radius: 50%;
      margin-left: 0;
      transform: translateX(0);
      transition: transform 0.2s linear;
    }

    .theme-toggle input:checked + .toggle-circle {
      transform: translateX(20px);
    }

    /* Accessibility focus indicators */
    button:focus, textarea:focus, input:focus {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="absolute top-4 right-4 z-10">
    <label class="theme-toggle">
      <span class="mr-2">🌞</span>
      <input id="modeToggle" type="checkbox">
      <div class="toggle-circle"></div>
      <span class="ml-2">🌙</span>
    </label>
  </div>

  <div class="glass fade-in w-full max-w-3xl p-6 rounded-2xl">
    <header class="mb-8">
      <h1 class="text-4xl font-bold text-center tracking-wide glow-text">AI Text Toolbox</h1>
      <p class="text-center text-gray-100 mt-2">Powerful NLP tools powered by Hugging Face models</p>
    </header>
    
    <div class="mb-4">
      <textarea 
        id="textInput" 
        class="w-full p-4 rounded-md bg-white bg-opacity-20 text-white mb-2 placeholder-gray-300 focus:bg-opacity-30 transition-all" 
        rows="6" 
        placeholder="Paste or type your text here..."
        aria-label="Input text for analysis"></textarea>
      <div class="text-right text-sm text-gray-300" id="charCounter">0 characters</div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
      <button id="btnSummarize" onclick="runAI('summarize')" class="btn flex items-center justify-center">
        <i class="fas fa-compress-alt mr-2"></i>Summarize
      </button>
      <button id="btnSentiment" onclick="runAI('sentiment')" class="btn flex items-center justify-center">
        <i class="fas fa-smile-beam mr-2"></i>Sentiment
      </button>
      <button id="btnKeywords" onclick="runAI('keywords')" class="btn flex items-center justify-center">
        <i class="fas fa-key mr-2"></i>Keywords
      </button>
      <button id="btnClassify" onclick="runAI('classify')" class="btn flex items-center justify-center">
        <i class="fas fa-tags mr-2"></i>Classify
      </button>
      <button id="btnAskQ" onclick="askQuestion()" class="btn col-span-2 sm:col-span-1 flex items-center justify-center">
        <i class="fas fa-question-circle mr-2"></i>Ask Q
      </button>
      <button id="btnGenerate" onclick="runAI('generate')" class="btn col-span-2 flex items-center justify-center">
        <i class="fas fa-magic mr-2"></i>Generate Text
      </button>
    </div>

    <div class="relative mb-4">
      <input 
        id="questionInput" 
        class="w-full p-3 rounded-md bg-white bg-opacity-20 text-white placeholder-gray-300 focus:bg-opacity-30 transition-all" 
        placeholder="Type a question about the text (for Q&A)..." 
        aria-label="Question for Q&A function" />
      <div class="absolute right-3 top-3 text-gray-300 text-xs" id="qaHint">
        <i class="fas fa-info-circle"></i> Used with the "Ask Q" button
      </div>
    </div>

    <div class="bg-white bg-opacity-20 p-4 rounded-md text-white output-card" id="outputContainer">
      <div id="loader" class="loader hidden"></div>
      <div id="output" class="whitespace-pre-wrap">
        <div class="text-center text-gray-300">
          <i class="fas fa-robot text-3xl mb-2"></i>
          <p>Results will appear here</p>
        </div>
      </div>
    </div>

    <div class="mt-4 flex justify-between items-center">
      <button id="copyBtn" class="text-sm text-white bg-opacity-30 bg-white px-3 py-1 rounded flex items-center opacity-70 hover:opacity-100 transition-opacity" onclick="copyOutput()">
        <i class="fas fa-copy mr-1"></i> Copy
      </button>
      <button id="clearBtn" class="text-sm text-white bg-opacity-30 bg-white px-3 py-1 rounded flex items-center opacity-70 hover:opacity-100 transition-opacity" onclick="clearAll()">
        <i class="fas fa-trash-alt mr-1"></i> Clear All
      </button>
    </div>
  </div>

  <audio id="clickSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4e3a7746c3.mp3?filename=button-click-124467.mp3"></audio>

  <script>
    const clickSound = document.getElementById("clickSound");
    const textInput = document.getElementById("textInput");
    const questionInput = document.getElementById("questionInput");
    const charCounter = document.getElementById("charCounter");
    const outputBox = document.getElementById("output");
    const loader = document.getElementById("loader");
    const buttons = document.querySelectorAll(".btn");

    // Character counter
    textInput.addEventListener("input", function() {
      charCounter.textContent = `${this.value.length} characters`;
    });

    function playClick() {
      clickSound.currentTime = 0;
      clickSound.play().catch(e => console.log("Audio play failed:", e));
    }

    function setLoading(isLoading) {
      if (isLoading) {
        loader.classList.remove("hidden");
        outputBox.classList.add("hidden");
        buttons.forEach(btn => btn.disabled = true);
      } else {
        loader.classList.add("hidden");
        outputBox.classList.remove("hidden");
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    function showError(message) {
      outputBox.innerHTML = `
        <div class="text-red-300">
          <i class="fas fa-exclamation-triangle mr-2"></i>
          <span>${message}</span>
        </div>`;
    }

    function validateInput() {
      if (!textInput.value.trim()) {
        showError("Please enter some text to analyze");
        return false;
      }
      return true;
    }

    async function runAI(type) {
      playClick();
      
      if (!validateInput()) return;
      
      setLoading(true);
      
      try {
        const response = await fetch(`http://127.0.0.1:5000/${type}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: textInput.value })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          displayResult(data, type);
        } else {
          showError(data.error || "An unknown error occurred");
        }
      } catch (error) {
        showError(`Failed to connect to server: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    function displayResult(data, type) {
      let html = '';
      
      switch(type) {
        case 'summarize':
          html = `
            <div>
              <div class="font-bold text-lg mb-2"><i class="fas fa-compress-alt mr-2"></i>Summary</div>
              <p>${data.summary}</p>
            </div>`;
          break;
          
        case 'sentiment':
          const sentimentIcon = data.sentiment === 'POSITIVE' ? 
            '<i class="fas fa-smile-beam text-green-300"></i>' : 
            '<i class="fas fa-frown text-red-300"></i>';
          html = `
            <div>
              <div class="font-bold text-lg mb-2"><i class="fas fa-heart mr-2"></i>Sentiment Analysis</div>
              <p class="flex items-center text-xl mb-2">
                ${sentimentIcon}
                <span class="ml-2">${data.sentiment}</span>
              </p>
              <p class="text-sm">Confidence: ${data.confidence || 'N/A'}</p>
            </div>`;
          break;
          
        case 'keywords':
          html = `
            <div>
              <div class="font-bold text-lg mb-2"><i class="fas fa-key mr-2"></i>Keywords</div>
              <div class="flex flex-wrap gap-2">
                ${data.keywords.map(keyword => 
                  `<span class="bg-indigo-500 bg-opacity-40 px-2 py-1 rounded-lg text-sm">${keyword}</span>`
                ).join('')}
              </div>
            </div>`;
          break;
          
        case 'classify':
          html = `
            <div>
              <div class="font-bold text-lg mb-2"><i class="fas fa-tags mr-2"></i>Classification</div>
              <div class="space-y-2">
                ${data.classifications.map(cls => 
                  `<div class="flex justify-between">
                    <span>${cls.label}</span>
                    <span class="text-gray-300">${cls.score}</span>
                   </div>`
                ).join('')}
              </div>
            </div>`;
          break;
          
        case 'generate':
          html = `
            <div>
              <div class="font-bold text-lg mb-2"><i class="fas fa-magic mr-2"></i>Generated Text</div>
              <p>${data.generated}</p>
            </div>`;
          break;
          
        default:
          html = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      }
      
      outputBox.innerHTML = html;
    }

    async function askQuestion() {
      playClick();
      
      if (!validateInput()) return;
      
      if (!questionInput.value.trim()) {
        showError("Please enter a question to ask about the text");
        return;
      }
      
      setLoading(true);
      
      try {
        const response = await fetch("http://127.0.0.1:5000/qa", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            question: questionInput.value,
            context: textInput.value 
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          outputBox.innerHTML = `
            <div>
              <div class="font-bold text-lg mb-2"><i class="fas fa-question-circle mr-2"></i>Question & Answer</div>
              <div class="bg-indigo-900 bg-opacity-30 p-3 rounded mb-3">
                <div class="text-gray-300 text-sm">Question:</div>
                <div>${questionInput.value}</div>
              </div>
              <div class="bg-purple-900 bg-opacity-30 p-3 rounded">
                <div class="text-gray-300 text-sm">Answer:</div>
                <div>${data.answer}</div>
                ${data.confidence ? `<div class="text-xs text-gray-300 mt-2">Confidence: ${data.confidence}</div>` : ''}
              </div>
            </div>`;
        } else {
          showError(data.error || "An unknown error occurred");
        }
      } catch (error) {
        showError(`Failed to connect to server: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    function copyOutput() {
      const textToCopy = outputBox.textContent;
      navigator.clipboard.writeText(textToCopy).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.innerHTML = '<i class="fas fa-check mr-1"></i> Copied!';
        setTimeout(() => {
          copyBtn.innerHTML = '<i class="fas fa-copy mr-1"></i> Copy';
        }, 2000);
      });
    }

    function clearAll() {
      textInput.value = '';
      questionInput.value = '';
      charCounter.textContent = '0 characters';
      outputBox.innerHTML = `
        <div class="text-center text-gray-300">
          <i class="fas fa-robot text-3xl mb-2"></i>
          <p>Results will appear here</p>
        </div>`;
    }

    document.getElementById("modeToggle").addEventListener("change", function() {
      if (this.checked) {
        document.body.style.background = "linear-gradient(to right, #0f0c29, #302b63, #24243e)";
      } else {
        document.body.style.background = "url('/static/background.jpeg') no-repeat center center fixed";
        document.body.style.backgroundSize = "cover";
      }
    });

    // Initialize character counter
    charCounter.textContent = `${textInput.value.length} characters`;
  </script>
</body>
</html>
